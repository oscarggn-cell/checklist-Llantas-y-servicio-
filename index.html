<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checklist de suspensión y frenos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap">
<style>
:root{--bg:#f1f2ee;--card:#fff;--ink:#1c2228;--mute:#5d6770;--line:#d3d6d0;--steel:#2b5876;--ok:#2e7d4f;--warn:#b97d00;--bad:#b3372c;--wa:#1a8f4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181c;--card:#1e252b;--ink:#eceeea;--mute:#98a3ac;--line:#37414a;--steel:#7fb2d3;--ok:#5cc188;--warn:#e0a83a;--bad:#ef7a6d;--wa:#3bb26d}}
:root[data-theme="dark"]{--bg:#14181c;--card:#1e252b;--ink:#eceeea;--mute:#98a3ac;--line:#37414a;--steel:#7fb2d3;--ok:#5cc188;--warn:#e0a83a;--bad:#ef7a6d;--wa:#3bb26d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 110px}
h1{font:700 26px/1.1 "Barlow Semi Condensed",system-ui,sans-serif;margin:6px 0 4px}
h2{font:700 19px/1.2 "Barlow Semi Condensed",system-ui,sans-serif;margin:26px 0 10px;padding-bottom:6px;border-bottom:3px solid var(--steel);color:var(--steel)}
.sub{color:var(--mute);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--mute);font-weight:500}
input,select{width:100%;font:inherit;font-size:16px;padding:10px;margin-top:3px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.full{grid-column:1/-1}
.item{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:8px}
.item.ok{border-left-color:var(--ok)}.item.att{border-left-color:var(--warn)}.item.bad{border-left-color:var(--bad)}
.name{font:600 17px/1.2 "Barlow Semi Condensed",system-ui,sans-serif}
.hint{font-size:13px;color:var(--mute);margin:2px 0 8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font:600 15px/1 "Barlow Semi Condensed",system-ui,sans-serif;min-height:44px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;cursor:pointer}
.seg button.on[data-v=ok]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button.on[data-v=att]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button.on[data-v=bad]{background:var(--bad);border-color:var(--bad);color:#fff}
.note{margin-top:8px;display:none}.item.ok .note,.item.att .note,.item.bad .note{display:block}
.note input{margin:0;padding:8px 10px;font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.bar button{font:700 16px/1 "Barlow Semi Condensed",system-ui,sans-serif;min-height:48px;padding:0 14px;border-radius:6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.bar #wa{background:var(--wa);border-color:var(--wa);color:#fff;font-size:17px}
#prog{grid-column:1/-1;font-size:13px;color:var(--mute);margin-top:-2px}
textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);min-height:80px}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Suspensión y frenos</h1>
<p class="sub">Marca cada punto y envía el resultado por WhatsApp.</p>
<div class="grid">
<label class="full">Cliente<input id="cliente" autocomplete="off"></label>
<label class="full">Vehículo (marca, modelo, año)<input id="vehiculo" autocomplete="off"></label>
<label>Placas<input id="placas" autocapitalize="characters" autocomplete="off"></label>
<label>Kilometraje<input id="km" inputmode="numeric" autocomplete="off"></label>
<label>Técnico<input id="tecnico" autocomplete="off"></label>
<label>Tipo<select id="tipo"><option value="">Elegir</option><option>Sedán/compacto</option><option>SUV/camioneta</option><option>Pickup de trabajo</option><option>Eléctrico/híbrido</option><option>Deportivo</option></select></label>
</div>
<div id="list"></div>
<h2>Observaciones</h2>
<textarea id="obs" placeholder="Trabajos recomendados, comentarios para el cliente"></textarea>
</main>
<div class="bar"><div>
<button id="wa" type="button">Enviar por WhatsApp</button>
<button id="cp" type="button">Copiar</button>
<button id="rs" type="button">Nuevo</button>
<span id="prog"></span>
</div></div>
<script>
var SEC=[
["Suspensión y dirección",[
["Amortiguadores","Fugas de aceite, rebote excesivo, ruidos en baches"],
["Resortes / muelles","Grietas, fatiga, altura despareja"],
["Bujes de brazos y barra estabilizadora","Holgura, grietas, resequedad"],
["Rótulas superiores e inferiores","Juego, guardapolvos rotos"],
["Terminales de dirección y cremallera","Juego, fugas, guardapolvos"],
["Bieletas de barra estabilizadora","Holgura o golpeteo"],
["Baleros de rueda","Ruido al girar, juego en la llanta"],
["Bases de amortiguador","Ruidos al girar el volante"],
["Llantas","Desgaste irregular, presión, daños"],
["Alineación","Convergencia, caída, avance"],
["Balanceo","Vibración en volante a cierta velocidad"]]],
["Frenos",[
["Balatas / pastillas","Espesor (cambiar bajo 3 mm), desgaste parejo"],
["Discos","Espesor mínimo, alabeo, rayaduras, escalón"],
["Tambores y zapatas","Desgaste, ovalación, cilindros con fugas"],
["Calipers","Pistones libres, guías lubricadas, sin fugas"],
["Líquido de frenos","Nivel, color, humedad (cambio ~2 años)"],
["Mangueras y líneas","Grietas, abultamientos, corrosión"],
["Freno de estacionamiento","Recorrido y ajuste de cable"],
["Pedal de freno","Firmeza, recorrido, sin sensación esponjosa"],
["Booster / servofreno","Asistencia correcta"],
["Ruidos al frenar","Chillido, metal con metal, vibración"]]],
["Prueba de manejo",[
["Se va hacia un lado al frenar",""],
["Vibración en pedal o volante",""],
["Ruidos en curvas, topes o baches",""],
["Volante centrado en línea recta",""]]]];
var S={f:{},v:{},n:{}},KEY="chk-susp-frenos-v1",F=["cliente","vehiculo","placas","km","tecnico","tipo","obs"];
var L={ok:"OK",att:"Atención",bad:"Cambiar"};
function $(i){return document.getElementById(i)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var d=localStorage.getItem(KEY);if(d)S=JSON.parse(d)}catch(e){}}
function build(){
 var h="",k=0;
 SEC.forEach(function(s){
  h+="<h2>"+s[0]+"</h2>";
  s[1].forEach(function(it){
   h+='<div class="item" id="i'+k+'"><div class="name">'+it[0]+'</div>'+(it[1]?'<div class="hint">'+it[1]+'</div>':'<div style="height:8px"></div>')+
   '<div class="seg">'+["ok","att","bad"].map(function(v){return '<button type="button" data-k="'+k+'" data-v="'+v+'">'+L[v]+'</button>'}).join("")+'</div>'+
   '<div class="note"><input placeholder="Nota (opcional)" data-n="'+k+'"></div></div>';
   k++;
  });
 });
 $("list").innerHTML=h;
}
function paint(){
 var total=0,done=0;
 SEC.forEach(function(s){s[1].forEach(function(){total++})});
 for(var k=0;k<total;k++){
  var el=$("i"+k),v=S.v[k]||"";
  el.className="item "+v;
  Array.prototype.forEach.call(el.querySelectorAll("button"),function(b){b.className=b.dataset.v===v?"on":""});
  el.querySelector("input").value=S.n[k]||"";
  if(v)done++;
 }
 F.forEach(function(f){$(f).value=S.f[f]||""});
 $("prog").textContent=done+" de "+total+" puntos revisados";
}
function summary(){
 var g=function(f){return (S.f[f]||"").trim()},k=0,bad=[],att=[],ok=0,pend=0;
 SEC.forEach(function(s){s[1].forEach(function(it){
  var v=S.v[k],n=(S.n[k]||"").trim(),line="• "+it[0]+(n?" ("+n+")":"");
  if(v==="bad")bad.push(line);else if(v==="att")att.push(line);else if(v==="ok")ok++;else pend++;
  k++;
 })});
 var d=new Date().toLocaleDateString("es-MX");
 var t="*Revisión de suspensión y frenos*\n"+d+"\n";
 if(g("cliente"))t+="Cliente: "+g("cliente")+"\n";
 if(g("vehiculo"))t+="Vehículo: "+g("vehiculo")+(g("tipo")?" ("+g("tipo")+")":"")+"\n";
 if(g("placas"))t+="Placas: "+g("placas")+"\n";
 if(g("km"))t+="Km: "+g("km")+"\n";
 if(g("tecnico"))t+="Técnico: "+g("tecnico")+"\n";
 if(bad.length)t+="\n🔴 *Cambiar*\n"+bad.join("\n")+"\n";
 if(att.length)t+="\n🟡 *Atención*\n"+att.join("\n")+"\n";
 t+="\n🟢 En buen estado: "+ok+" puntos";
 if(pend)t+="\nSin revisar: "+pend;
 if(g("obs"))t+="\n\n*Observaciones:* "+g("obs");
 return t;
}
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.k!==undefined){var k=b.dataset.k;S.v[k]=S.v[k]===b.dataset.v?"":b.dataset.v;save();paint()}
});
document.addEventListener("input",function(e){
 var t=e.target;
 if(t.dataset.n!==undefined)S.n[t.dataset.n]=t.value;
 else if(F.indexOf(t.id)>-1)S.f[t.id]=t.value;
 save();
});
$("wa").onclick=function(){window.open("https://wa.me/?text="+encodeURIComponent(summary()),"_blank","noopener")};
$("cp").onclick=function(){
 var t=summary(),b=$("cp");
 function ok(){b.textContent="Copiado";setTimeout(function(){b.textContent="Copiar"},1500)}
 try{navigator.clipboard.writeText(t).then(ok,function(){fb()})}catch(e){fb()}
 function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()}
};
$("rs").onclick=function(){if(confirm("¿Borrar todo y empezar una revisión nueva?")){S={f:{},v:{},n:{}};save();paint()}};
build();load();paint();
</script>
</body>
</html>
